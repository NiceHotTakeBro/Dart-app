<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dart-Training</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<style>
:root{--bg:#f4f5f7;--cd:#fff;--tx:#1b1f27;--mu:#667085;--ac:#1f6feb;--ok:#1a7f4b;--bd:#d9dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--cd:#1c212b;--tx:#eef0f4;--mu:#9aa3b2;--ac:#5aa2ff;--ok:#4cc38a;--bd:#2d3441;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--cd:#1c212b;--tx:#eef0f4;--mu:#9aa3b2;--ac:#5aa2ff;--ok:#4cc38a;--bd:#2d3441;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 Arial,Helvetica,sans-serif}
nav{display:flex;gap:8px;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1}
button{min-height:48px;padding:0 14px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);font:inherit;font-weight:700}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 10px 24px;max-width:1100px;margin:auto}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card.today{border:2px solid var(--ac)}
h2{margin:0 0 4px;font-size:18px}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:minmax(300px,1.2fr) 1fr;gap:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.big{font-size:26px;font-weight:700}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.st b{display:block;font-size:22px}
svg.b{width:100%;max-height:78vh;touch-action:manipulation}
svg.b path,svg.b circle{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
</style></head><body>
<div id="pf" class="row" style="padding:10px 10px 0;justify-content:flex-start"></div>
<nav><button id="n0" class="on">Wochenplan</button><button id="n1">Training</button><button id="n2">Verlauf</button><button id="n3">Kamera</button></nav>
<main id="m"></main>
<section id="cam" hidden style="padding:0 10px 24px;max-width:1100px;margin:auto">
<div class="card"><h2>Kamera (Test) · Version 17</h2><div class="mu" id="cmsg">Starte die Kamera mit leerer Scheibe. Danach einfach werfen – die App erkennt jeden Pfeil von selbst.</div></div>
<div class="card"><div style="position:relative;line-height:0;overflow:hidden;border-radius:8px"><video id="cv" playsinline muted autoplay style="width:100%;border-radius:8px;background:#000"></video><canvas id="ov" style="position:absolute;left:0;top:0;width:100%;height:100%"></canvas><div id="cst2" style="position:absolute;left:8px;top:8px;z-index:3;background:#000b;color:#fff;padding:6px 10px;border-radius:8px;font:700 14px/1.2 Arial">● Kamera aus</div><div id="cfl" style="position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:4;background:#1a7f4b;color:#fff;padding:10px 16px;border-radius:10px;font:700 17px/1.3 Arial;text-align:center;display:none;box-shadow:0 2px 12px #0006"></div><div style="position:absolute;right:8px;bottom:8px;display:flex;gap:6px;align-items:center;z-index:3"><button id="zm" style="min-width:48px;opacity:.9">−</button><b id="zl" style="color:#fff;background:#0009;padding:4px 8px;border-radius:8px;line-height:1.2">1.0×</b><button id="zp" style="min-width:48px;opacity:.9">+</button></div></div></div>
<div class="row" style="margin-bottom:10px"><button id="c9" class="pri" style="flex:1;min-height:56px">Standbild speichern (Foto zum Hochladen im Chat)</button></div>
<div class="row"><button id="c1" class="pri">Kamera starten</button><button id="c8">Scheibe automatisch suchen</button><button id="c2">Scheibe markieren</button><button id="c3">Referenz neu setzen (Scheibe leer)</button><button id="c4">Jetzt prüfen</button><button id="c7">Aufnahme ins Training übernehmen</button></div>
<div class="card" id="turn" style="margin-top:10px"></div>
<div class="mu" id="cst" style="margin-top:8px"></div></section>
<script>
const $=s=>document.querySelector(s), K="dart_v1";
let ST,DB;try{ST=JSON.parse(localStorage.getItem("dart_v2"))}catch(e){}
if(!ST){let old=null;try{old=JSON.parse(localStorage.getItem(K))}catch(e){}
 ST={cur:"p1",cam:(old&&old.cam)||{},p:{p1:{name:"Lukas",db:old||{sessions:[]}},p2:{name:"Profil 2",db:{sessions:[]}}}}}
const useP=id=>{ST.cur=id;DB=ST.p[id].db;DB.sessions=DB.sessions||[];DB.cam=ST.cam};useP(ST.cur);
const save=()=>{try{localStorage.setItem("dart_v2",JSON.stringify(ST))}catch(e){}};
const B=(t,n,g)=>({t,n,g,d:0,h:0}),NUM=[...Array(20)].map((_,i)=>i+1);
const DAYS=["mo","di","mi","do","fr","sa","so"],DN=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const P={
mo:{n:"Triple 20",x:"100 Pfeile T20 (Treffer und Punkte zählen), 30 auf T19, 45 auf T20 als Druck-Aufnahmen, 30 auf Bull.",b:()=>[B("T20",100),B("T19",30),B("T20",45),B("B",30)]},
di:{n:"Gruppierung",x:"Je 60 Pfeile auf T20, T19, T18, T17, dann 40 auf Bull. Pfeile eng zusammen halten.",b:()=>["T20","T19","T18","T17"].map(t=>B(t,60)).concat([B("B",40)])},
mi:{n:"Around the Clock",x:"Singles 1 bis 20, Doppel D1 bis D20 und D-Bull (jeweils bis zum Treffer, Pfeile zählen), dann je 15 Pfeile auf D20, D16, D8.",b:()=>NUM.map(i=>B("N"+i,"h","s")).concat(NUM.map(i=>B("D"+i,"h","d")),[B("DB","h","d")],["D20","D16","D8"].map(t=>B(t,15,"c")))},
do:{n:"Scoring",x:"5 Legs 501. Pfeile zählen, Average ausrechnen. (Vereinfacht: ohne Double-Out.)",m:"501",legs:5},
fr:{n:"Doppel",x:"Je 20 Pfeile auf D20, D16, D8, D10, D12, D6, D5, D4, D2.",b:()=>["D20","D16","D8","D10","D12","D6","D5","D4","D2"].map(t=>B(t,20))},
sa:{n:"Spieltag (Wochentest)",x:"10 Legs 501 mit Double-Out. Dein Average hier zählt für den Verlauf.",m:"501",legs:10,dout:true},
so:{n:"Locker",x:"15 bis 20 Minuten frei werfen, ohne Druck.",m:"free"}};
const lab=t=>t[0]=="N"?"Feld "+t.slice(1)+" (beliebig)":t=="B"?"Bull":t=="DB"?"Doppel-Bull":t;
const match=(t,c)=>t=="B"?(c=="SB"||c=="DB"):t[0]=="N"?(c.slice(1)==t.slice(1)):t==c;
let s=null,H=[],view=0;
const today=(new Date().getDay()+6)%7;
const avg=(p,d)=>d?(p/d*3).toFixed(1):"–";
function start(i){const k=DAYS[i],p=P[k];H=[];
 s={k,name:DN[i]+" · "+p.n,m:p.m||"blocks",darts:0,pts:0,log:[],bi:0,done:false};
 if(s.m=="blocks")s.bl=p.b();
 if(s.m=="501")Object.assign(s,{legs:p.legs,leg:1,rem:501,ld:0,ldone:[],dout:!!p.dout,t:0,ts:501});
 go(1)}
function d501(c,v){const nr=s.rem-v,bust=nr<0||nr==1||(nr==0&&c[0]!="D");
 if(bust){const pen=3-s.t;s.darts+=pen;s.ld+=pen;s.pts-=s.ts-s.rem;s.rem=s.ts;s.t=0;s.log.push("Bust");return}
 s.darts++;s.ld++;s.pts+=v;s.rem=nr;s.log.push(c);s.t++;
 if(nr==0){s.ldone.push(s.ld);s.leg++;s.rem=501;s.ld=0;s.t=0;s.ts=501;if(s.leg>s.legs)fin();return}
 if(s.t==3){s.t=0;s.ts=s.rem}}
function dart(c,v){if(!s||s.done)return;H.push(JSON.stringify(s));if(s.m=="501"&&s.dout){d501(c,v);render();return}
 const sc=s.m=="501"?Math.min(v,s.rem):v;s.darts++;s.pts+=sc;s.log.push(c=="0"?"0":c);
 if(s.m=="blocks"){const b=s.bl[s.bi];b.d++;if(match(b.t,c))b.h++;
  if(b.n=="h"?b.h>=1:b.d>=b.n){s.bi++;if(s.bi>=s.bl.length)fin()}}
 if(s.m=="501"){s.rem-=sc;s.ld++;if(s.rem<=0){s.ldone.push(s.ld);s.leg++;s.rem=501;s.ld=0;if(s.leg>s.legs)fin()}}
 render()}
function undo(){if(H.length){s=JSON.parse(H.pop());render()}}
function skip(){if(s&&s.m=="blocks"){H.push(JSON.stringify(s));s.bi++;if(s.bi>=s.bl.length)fin();render()}}
function fin(){if(!s||s.done)return;s.done=true;
 if(s.darts>0){const r={id:Date.now(),date:new Date().toISOString().slice(0,10),k:s.k,name:s.name,darts:s.darts,pts:s.pts,avg:+avg(s.pts,s.darts)};
  if(s.bl){r.bl=s.bl.filter(b=>b.d).map(b=>({t:b.t,d:b.d,h:b.h,g:b.g}))}
  if(s.m=="501")r.legs=s.ldone;
  DB.sessions.unshift(r);s.saved=true;save()}
 render()}
function go(v){view=v;const c=$("#cv");if(v!=3&&c&&c.srcObject){c.srcObject.getTracks().forEach(t=>t.stop());c.srcObject=null}$("#m").hidden=v==3;$("#cam").hidden=v!=3;["n0","n1","n2","n3"].forEach((id,i)=>$("#"+id).className=i==v?"on":"");render()}
["n0","n1","n2","n3"].forEach((id,i)=>$("#"+id).onclick=()=>go(i));

// Scheibe
const ORD=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
function arc(r1,r2,a0,a1){const p=(r,a)=>[(r*Math.sin(a)).toFixed(1),(-r*Math.cos(a)).toFixed(1)],A=p(r2,a0),Bp=p(r2,a1),C=p(r1,a1),D=p(r1,a0);return`M${A}A${r2} ${r2} 0 0 1 ${Bp}L${C}A${r1} ${r1} 0 0 0 ${D}Z`}
function board(){let o='<svg class="b" viewBox="-200 -200 400 400"><circle r="198" fill="#111"/>';
 ORD.forEach((n,i)=>{const a0=(i*18-9)*Math.PI/180,a1=(i*18+9)*Math.PI/180,e=i%2==0,sf=e?"#1a1a1a":"#f1e6c8",rf=e?"#c8372d":"#2e8b57";
  [[15.9,99,"S",1,sf],[99,107,"T",3,rf],[107,162,"S",1,sf],[162,170,"D",2,rf]].forEach(r=>{o+=`<path d="${arc(r[0],r[1],a0,a1)}" fill="${r[4]}" stroke="#777" stroke-width=".6" data-c="${r[2]+n}" data-v="${n*r[3]}"/>`});
  const am=i*18*Math.PI/180;o+=`<text x="${(185*Math.sin(am)).toFixed(1)}" y="${(-185*Math.cos(am)+5).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Arial">${n}</text>`});
 o+='<circle r="15.9" fill="#2e8b57" stroke="#777" stroke-width=".6" data-c="SB" data-v="25"/><circle r="6.35" fill="#c8372d" stroke="#777" stroke-width=".6" data-c="DB" data-v="50"/></svg>';return o}

function render(){const m=$("#m");if(view==3)return;if(view==0)m.innerHTML=plan();else if(view==1)m.innerHTML=train();else m.innerHTML=hist();
 const sv=m.querySelector("svg.b");if(sv)sv.onclick=e=>{const t=e.target.closest("[data-c]");if(t)dart(t.dataset.c,+t.dataset.v)};
 m.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>start(+b.dataset.start));
 const q=id=>m.querySelector("#"+id);
 if(q("miss"))q("miss").onclick=()=>dart("0",0);if(q("undo"))q("undo").onclick=undo;if(q("skip"))q("skip").onclick=skip;
 if(q("fin"))q("fin").onclick=fin;if(q("note"))q("note").onchange=function(){if(s&&s.saved&&DB.sessions[0]){DB.sessions[0].note=this.value;save()}};
 m.querySelectorAll("[data-wn]").forEach(i=>i.onchange=()=>{(DB.notes=DB.notes||{})[i.dataset.wn]=i.value;save()});
 if(q("exp"))q("exp").onclick=()=>{const t=q("ex");t.hidden=false;t.value=csv();t.select()};if(q("new"))q("new").onclick=()=>{s=null;go(0)};
 if(q("reset"))q("reset").onclick=function(){if(this.dataset.a){ST.p[ST.cur].db=DB={sessions:[],cam:ST.cam};save();render()}else{this.dataset.a=1;this.textContent="Wirklich alles löschen? Nochmal tippen"}}}

function plan(){return DAYS.map((k,i)=>`<div class="card ${i==today?"today":""}"><div class="row"><div><h2>${DN[i]}${i==today?" (heute)":""} · ${P[k].n}</h2><div class="mu">${P[k].x}</div></div><button class="${i==today?"pri":""}" data-start="${i}">Training starten</button></div></div>`).join("")}

function train(){if(!s)return'<div class="card"><h2>Kein Training aktiv</h2><div class="mu">Starte im Wochenplan eine Einheit.</div></div>';
 if(s.done){let t=`<div class="card"><h2>Fertig: ${s.name}</h2><div class="st"><div><b>${s.darts}</b>Pfeile</div><div><b>${s.pts}</b>Punkte</div><div><b>${avg(s.pts,s.darts)}</b>Average</div><div><b>${s.legs?s.ldone.length:"–"}</b>Legs</div></div></div>`;
  if(s.bl)t+=`<div class="card"><table><tr><th>Ziel</th><th>Pfeile</th><th>Treffer</th><th>Quote</th></tr>${s.bl.filter(b=>b.d).map(b=>`<tr><td>${lab(b.t)}</td><td>${b.d}</td><td>${b.h}</td><td>${Math.round(b.h/b.d*100)}%</td></tr>`).join("")}</table></div>`;
  return t+'<div class="card"><input id="note" placeholder="Notiz zu dieser Einheit" style="width:100%;min-height:44px;font:inherit;box-sizing:border-box"></div><button class="pri" id="new">Zurück zum Wochenplan</button>'}
 let info="";
 if(s.m=="blocks"){const b=s.bl[s.bi];info=`<div class="mu">Block ${s.bi+1} von ${s.bl.length}</div><div class="big">Ziel: ${lab(b.t)}</div><div>Pfeile ${b.d}${b.n=="h"?" (bis zum Treffer)":" / "+b.n} · Treffer ${b.h}</div><div class="bar"><i style="width:${b.n=="h"?0:Math.min(100,b.d/b.n*100)}%"></i></div>`}
 else if(s.m=="501")info=`<div class="mu">Leg ${s.leg} von ${s.legs}</div><div class="big">Rest: ${s.rem}</div><div>Pfeile im Leg: ${s.ld}${s.dout?" · Double-Out · Pfeil "+(s.t+1)+" von 3":""}</div>${s.log[s.log.length-1]=="Bust"?"<div style='color:#c8372d;font-weight:700'>Bust: Rest zurückgesetzt</div>":""}`;
 else info='<div class="big">Freies Werfen</div><div class="mu">Tippe die Treffer auf der Scheibe.</div>';
 return`<div class="grid"><div class="card">${board()}</div><div><div class="card">${info}</div>
 <div class="card"><div class="st"><div><b>${s.darts}</b>Pfeile</div><div><b>${s.pts}</b>Punkte</div><div><b>${avg(s.pts,s.darts)}</b>Average</div><div><b>${s.log.slice(-3).join(" ")||"–"}</b>Letzte</div></div></div>
 <div class="row"><button id="miss">Daneben</button><button id="undo">Rückgängig</button>${s.m=="blocks"?'<button id="skip">Block überspringen</button>':""}<button class="pri" id="fin">Beenden und speichern</button></div></div></div>`}

const esc=v=>String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const mon=d=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()-(x.getDay()+6)%7);return x},zw=w=>35+12.5*w/12;
function rows(){const S=DB.sessions.slice().reverse(),W=[...Array(12)].map(()=>({}));
 if(S.length){const f0=mon(S[0].date);S.forEach(r=>{const w=Math.floor(Math.round((mon(r.date)-f0)/864e5)/7);if(w>=0&&w<12)W[w][r.k]=r})}
 return W.map((o,i)=>{const w=i+1,a=o.sa?o.sa.avg:null,t=o.mo&&o.mo.bl?o.mo.bl.find(b=>b.t=="T20"):null,g=x=>o.mi&&o.mi.bl?o.mi.bl.filter(b=>b.g==x).reduce((n,b)=>n+b.d,0):"–";
  return[w,o.sa?o.sa.date.split("-").reverse().join("."):"–",a==null?"–":a.toFixed(1),zw(w).toFixed(1),a==null?"–":((a-zw(w)>=0?"+":"")+(a-zw(w)).toFixed(1)),t?t.h:"–",g("s"),g("d"),o.do?o.do.avg.toFixed(1):"–",(DB.notes||{})[w]||""]})}
function csv(){return["Woche;Datum;Average;Zielwert;Differenz;T20-Treffer (Mo);Singles Pfeile;Doppel Pfeile;Scoring-Average (Do);Notiz"].concat(rows().map(r=>r.join(";"))).join("\n")}
function wk(){const R=rows(),sa=DB.sessions.filter(x=>x.k=="sa"),last=sa.length?sa[0].avg:null,best=sa.length?Math.max(...sa.map(x=>x.avg)):null,f=v=>v==null?"–":v.toFixed(1);
 const X=w=>30+(w-1)*28,Y=v=>120-(v-30)/25*100,pt=R.filter(r=>r[2]!="–");
 let t=`<div class="card"><h2>Übersicht</h2><div class="st"><div><b>${f(last)}</b>Letzter Sa-Average</div><div><b>${f(best)}</b>Bester Sa-Average</div><div><b>${last==null?"–":(last-35>=0?"+":"")+(last-35).toFixed(1)}</b>zum Start (35)</div><div><b>${f((DB.sessions.find(x=>x.k=="do")||{}).avg)}</b>Letzter Do-Scoring-Ø</div></div></div>`;
 t+=`<div class="card"><h2>Average pro Woche</h2><svg viewBox="0 0 340 140" style="width:100%"><line x1="${X(1)}" y1="${Y(zw(1))}" x2="${X(12)}" y2="${Y(zw(12))}" stroke="var(--ok)" stroke-dasharray="4"/>${pt.length>1?`<polyline points="${pt.map(r=>X(r[0])+","+Y(+r[2])).join(" ")}" fill="none" stroke="var(--ac)" stroke-width="3"/>`:""}${pt.map(r=>`<circle cx="${X(r[0])}" cy="${Y(+r[2])}" r="4" fill="var(--ac)"/><text x="${X(r[0])}" y="${Y(+r[2])-8}" font-size="10" text-anchor="middle" fill="var(--tx)">${r[2]}</text>`).join("")}${R.filter(r=>r[8]!="–").map(r=>`<circle cx="${X(r[0])}" cy="${Y(+r[8])}" r="3.5" fill="#e08a1e"/>`).join("")}${R.map(r=>`<text x="${X(r[0])}" y="136" font-size="9" text-anchor="middle" fill="var(--mu)">${r[0]}</text>`).join("")}</svg><div class="mu">Gestrichelt: Zielwert von 35 auf 47,5 in 12 Wochen. Blau: Samstag (mit Double-Out). Orange: Donnerstag (Scoring ohne Double-Out). Woche 1 ist die Woche deiner ersten gespeicherten Einheit.</div></div>`;
 t+=`<div class="card"><h2>Wochentabelle</h2><div style="overflow-x:auto"><table><tr><th>Woche</th><th>Datum</th><th>Average</th><th>Zielwert</th><th>Differenz</th><th>T20-Treffer (Mo)</th><th>Singles (Pfeile)</th><th>Doppel (Pfeile)</th><th>Scoring-Ø (Do)</th><th>Notiz</th></tr>${R.map(r=>`<tr>${r.slice(0,9).map(c=>`<td>${c}</td>`).join("")}<td><input data-wn="${r[0]}" value="${esc(r[9])}" style="min-width:140px;min-height:36px;font:inherit"></td></tr>`).join("")}</table></div><div class="row" style="margin-top:8px"><button id="exp">Export als Text (für Excel)</button></div><textarea id="ex" hidden style="width:100%;height:160px;margin-top:8px"></textarea><div class="mu">Export: Text markieren, kopieren und in Excel einfügen.</div></div>`;return t}
function hist(){const S=DB.sessions;let t=wk();
 const sa=S.filter(x=>x.k=="sa").reverse();
 if(0&&sa.length){const W=320,Hh=140,n=Math.max(sa.length,2),x=i=>30+i*(W-40)/(n-1),y=v=>Hh-20-(v-30)/(55-30)*(Hh-30);
  const pts=sa.map((r,i)=>x(i)+","+y(r.avg)).join(" "),goal=[0,11].map(i=>x(i*(n-1)/11)+","+y(35+12.5*(i+1)/12)).join(" ");
  t+=`<div class="card"><h2>Wochentest-Average (Samstag)</h2><svg viewBox="0 0 ${W} ${Hh}" style="width:100%"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="3"/>${sa.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.avg)}" r="4" fill="var(--ac)"/><text x="${x(i)}" y="${y(r.avg)-8}" font-size="10" text-anchor="middle" fill="var(--tx)">${r.avg}</text>`).join("")}<line x1="30" y1="${y(35)}" x2="${W-10}" y2="${y(47.5)}" stroke="var(--ok)" stroke-dasharray="4"/></svg><div class="mu">Gestrichelt: Zielweg von 35 auf 47,5 in 12 Wochen. Start: 35.</div></div>`}

function autoTry(n){setTimeout(()=>{if(!cv.srcObject)return;const fc=()=>"Farbpunkte: rot "+(LAST?LAST.nr:0)+", grün "+(LAST?LAST.ng:0);

 g.font="16px Arial";["1 Rohbild","2 mit Gitter und Erkennung","3 Referenzbild"].slice(0,pn).forEach((t,i)=>{g.fillStyle="#000b";g.fillRect(0,i*h,260,24);g.fillStyle="#fff";g.fillText(t,6,i*h+17)});
 g.fillStyle="#000";lines.forEach((l,i)=>g.fillText(l,8,h*pn+26+i*26));

// ===== Automatisch neu kalibrieren, wenn sich das Tablet bewegt =====
let BASE=null,MON=null,PREV=null,STILL=0,LCHK=0,PEND=null,MST="off",FLT=null;const GMIN=1.5;
const toA=(c,z)=>c.map(([u,v])=>[.5+(u-.5)*z,.5+(v-.5)*z]),fromA=(c,z)=>c.map(([u,v])=>[.5+(u-.5)/z,.5+(v-.5)/z]);

function setSt(k){MST=k;const T={ok:["#1a7f4b","● Scheibe erkannt"],move:["#b7791f","● Bewegung im Bild – warte …"],check:["#b7791f","● Prüfe Lage der Scheibe …"],lost:["#c8372d","● Scheibe verdeckt oder nicht gefunden"],search:["#b7791f","● Suche die Scheibe …"],off:["#555","● Kamera aus"]}[k];const e=$("#cst2");e.style.background=T[0];e.textContent=T[1]}
function flash(t){const e=$("#cfl");e.textContent=t;e.style.display="block";clearTimeout(FLT);FLT=setTimeout(()=>e.style.display="none",4500)}
let MH=[],MV=0,MT=.03,MOVE0=0,NOISY=false,PF=null,PCALM=false;
function motion(f){// Bewegung in Feldern statt Einzelpixeln; Flackern (ganzes Bild oder Streifen) wird herausgerechnet
 const W=f.width,H=f.height,d=f.data,B=Math.max(6,Math.round(W/64)),nx=Math.floor(W/B),ny=Math.floor(H/B),g=new Float32Array(nx*ny);let tot=0;
 for(let by=0;by<ny;by++)for(let bx=0;bx<nx;bx++){let v=0;for(let j=by*B;j<by*B+B;j+=2)for(let i=bx*B;i<bx*B+B;i+=2){const k=(j*W+i)*4;v+=d[k]+d[k+1]+d[k+2]}g[by*nx+bx]=v;tot+=v}
 const mean=tot/g.length||1;for(let i=0;i<g.length;i++)g[i]/=mean;
 if(!PREV||PREV.length!=g.length){PREV=g;return 1}
 let cnt=0;const row=new Float32Array(nx);
 for(let by=0;by<ny;by++){for(let bx=0;bx<nx;bx++){const o=by*nx+bx;row[bx]=g[o]/Math.max(.05,PREV[o])}const r=Array.from(row).sort((a,b)=>a-b)[nx>>1];// Helligkeitsfaktor der Zeile (Flackerstreifen)
  for(let bx=0;bx<nx;bx++){const o=by*nx+bx;if(Math.abs(g[o]-r*PREV[o])>.08*Math.max(.3,PREV[o]))cnt++}}

 // Grenze passt sich dem normalen Rauschen der Kamera an (Median der letzten Werte)

function fullFit(f){const q=autoFit(f,false)||autoFit(f,true);return q?polish(q,f):null}
let EMPTY=null,TURN=[],PDART=null,WANT=null,MASK=null,BIGN=0,CALM=0;
function mul3(A,B){const C=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)C.push(A[r*3]*B[c]+A[r*3+1]*B[3+c]+A[r*3+2]*B[6+c]);return C}
function warpImg(old,oldHi,f){// altes Bild auf die neue Kameralage bzw. den neuen Zoom umrechnen (die Scheibe ist eine Ebene)
 const W=f.width,Hh=f.height,ow=old.width,oh=old.height,Ain=[1/(W*f.z),0,.5-.5/f.z,0,1/(Hh*f.z),.5-.5/f.z,0,0,1],Aout=[ow*old.z,0,ow*(.5-.5*old.z),0,oh*old.z,oh*(.5-.5*old.z),0,0,1],
  T=mul3(mul3(Aout,oldHi),mul3(HB,Ain)),o=new Uint8ClampedArray(W*Hh*4),a=old.data,c=f.data;
 for(let j=0;j<Hh;j++)for(let i=0;i<W;i++){const w=T[6]*i+T[7]*j+T[8],x=(T[0]*i+T[1]*j+T[2])/w,y=(T[3]*i+T[4]*j+T[5])/w,k=(j*W+i)*4;
  if(x>=0&&y>=0&&x<ow-1&&y<oh-1){const xi=x|0,yi=y|0,fx=x-xi,fy=y-yi,p=(yi*ow+xi)*4,q=p+ow*4;
   for(let ch=0;ch<3;ch++)o[k+ch]=(a[p+ch]*(1-fx)+a[p+4+ch]*fx)*(1-fy)+(a[q+ch]*(1-fx)+a[q+4+ch]*fx)*fy}
  else{o[k]=c[k];o[k+1]=c[k+1];o[k+2]=c[k+2]}o[k+3]=255}
 return{width:W,height:Hh,data:o,z:f.z}}
function moveRefs(oldHi,f){MASK=null;PDART=null;if(!oldHi)return;if(ref){ref=warpImg(ref,oldHi,f);ref.warped=1}if(EMPTY){EMPTY=warpImg(EMPTY,oldHi,f);EMPTY.warped=1}}
function applyCal(c,f,moved){const oldHi=Hi,pts=fromA(c.q,f.z);setCal(pts);DB.cam.cal=pts;save();BASE=c.s;PEND=null;DPX=null;
 if(moved){moveRefs(oldHi,f);flash("✓ Scheibe neu erkannt");cm("Das Tablet hat sich bewegt. Die Scheibe wurde neu erkannt. Die Pfeilerkennung läuft weiter.")}
 else{MASK=null;flash("✓ Scheibe erkannt");cm("Scheibe erkannt. Gleich bereit …")}
 ov();setSt("ok")}
function calCheck(f){// true = in diesem Durchgang keine Pfeilerkennung
 if(!HB){setSt("search");const c=fullFit(f);if(c&&c.s>=GMIN)applyCal(c,f,false);else setSt("lost");return true}
 const qa=toA(cal,f.z),s0=polish(qa,f,[]).s,B=BASE||s0;
 if(s0>=.9*B){BASE=Math.max(B,s0);PEND=null;if(MST!="ok")setSt("ok");return false}
 setSt("check");const r=polish(qa,f),mv=dispPx(r.q,qa,f);
 if(mv<1.5&&r.s>=GMIN){if(mv>=.7&&r.s>s0){const oh=Hi;setCal(fromA(r.q,f.z));DB.cam.cal=cal;save();moveRefs(oh,f);ov()}BASE=r.s;PEND=null;setSt("ok");return false}
 let c=r.s>=Math.max(GMIN,.85*B)?r:null;if(!c){const a=fullFit(f);if(a&&a.s>=GMIN)c=a}
 if(!c){PEND=null;setSt("lost");return true}
 if(c.s>=.85*B||(PEND&&dispPx(c.q,PEND.q,f)<1.5))applyCal(c,f,true);else PEND=c;
 return true}
function setRefs(f,manual){ref=f;EMPTY=f;TURN=[];PDART=null;det=null;DPX=null;renderTurn();ov();
 if(manual)flash("✓ Referenz gesetzt");else flash("✓ Bereit – du kannst werfen");
 cm("Bereit. Wirf einfach. Die App erkennt jeden Pfeil von selbst, sobald das Bild ruhig ist. Beim Ziehen der Pfeile beginnt eine neue Aufnahme.")}
function camGeo(f){const W=f.width,Ht=f.height,z=f.z,h=Hi,a=W*(.5-.5*z),b=Ht*(.5-.5*z);
 return{Hp:[W*z*h[0]+a*h[6],W*z*h[1]+a*h[7],W*z*h[2]+a,Ht*z*h[3]+b*h[6],Ht*z*h[4]+b*h[7],Ht*z*h[5]+b,h[6],h[7],1],toB:(i,j)=>ap(HB,.5+(i/W-.5)/z,.5+(j/Ht-.5)/z)}}
function addOrRemove(C,f,R0,E){// ist der Fleck ein neuer Pfeil (add) oder ein gezogener (rem)?
 const W=f.width,dist=(A,p)=>{let best=1e9;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const q=(p+dy*W+dx)*4,k=p*4,v=Math.abs(A.data[k]-E.data[q])+Math.abs(A.data[k+1]-E.data[q+1])+Math.abs(A.data[k+2]-E.data[q+2]);if(v<best)best=v}return best};
 let dc=0,dr=0;C.forEach(p=>{dc+=dist(f,p);dr+=dist(R0,p)});return dc<dr?"rem":"add"}
function dartCheck(f,force){
 if(ref.z!=f.z||ref.width!=f.width||ref.height!=f.height){ref=warpImg(ref,Hi,f);ref.warped=1;if(EMPTY&&(EMPTY.z!=f.z||EMPTY.width!=f.width||EMPTY.height!=f.height)){EMPTY=warpImg(EMPTY,Hi,f);EMPTY.warped=1}}
 const G=camGeo(f),key=f.width+"x"+f.height+":"+f.z+":"+JSON.stringify(cal);if(!MASK||MASK.key!=key){MASK=boardMask(f.width,f.height,G.toB);MASK.key=key}
 const R=findDart(f,ref,G.toB,G.Hp,MASK,!!ref.warped||NOISY);if(R.err=="Bild unruhig"){PDART=null;CALM=0;if(force)cm("Das Bild ist gerade unruhig (zum Beispiel Fokus). Bitte kurz warten.");return}
 const big=!R.err?R.comp.length>MASK.n*.06:R.err!="Kein Pfeil erkannt.";
 if(big){PDART=null;if(++BIGN>=3){ref=f;if(EMPTY&&!TURN.length)EMPTY=f;BIGN=0;cm("Das Bild hat sich dauerhaft verändert (zum Beispiel Licht). Die Referenz wurde neu gesetzt.")}
  else if(force)cm("Etwas Großes ist im Bild (Hand oder Person?) oder das Licht hat sich geändert. Bitte kurz warten.");return}
 BIGN=0;
 if(R.err){const was=PDART;PDART=null;if(force)cm("Kein neuer Pfeil gefunden.");

  if(ref.warped)ref=f;else if(!was&&ref.width==f.width&&ref.height==f.height&&ref.z==f.z){const a=ref.data,b=f.data,o=new Uint8ClampedArray(a.length);for(let i=0;i<a.length;i++)o[i]=a[i]+(b[i]-a[i])*EMA;ref={...ref,data:o}}
  if(++CALM>=6){CALM=0;if(EMPTY&&!TURN.length){const e=findDart(f,EMPTY,G.toB,G.Hp,MASK,true);if(e.err=="Kein Pfeil erkannt.")EMPTY=ref}}
  return}
 CALM=0;
 const kind=EMPTY?addOrRemove(R.comp,f,ref,EMPTY):"add";
 if(!force){// erst zählen, wenn der Pfeil in NCONF Prüfungen hintereinander an derselben Stelle gesehen wurde
  if(PDART&&PDART.kind==kind&&Math.hypot(PDART.tip[0]-R.tip[0],PDART.tip[1]-R.tip[1])<7*f.width/640){PDART.n++;PDART.tip=R.tip}else PDART={kind,tip:R.tip,n:1};
  if(PDART.n<NCONF)return}
 PDART=null;const W=f.width,xy=p=>[p%W,(p-p%W)/W];
 if(kind=="rem"){ref=f;const rest=findDart(f,EMPTY,G.toB,G.Hp,MASK,!!EMPTY.warped);if(rest.err=="Kein Pfeil erkannt.")EMPTY=f;
  TURN=[];det=null;DPX=null;renderTurn();ov();flash("Pfeile gezogen – neue Aufnahme");cm("Pfeile gezogen. Neue Aufnahme – wirf einfach weiter.");return}
 const[x,y]=G.toB(R.tip[0],R.tip[1]),[c,v]=field(x,y);det={c,v,x,y};TURN.push({c,v,x,y,r:null,tr:false});ref=f;

 flash("🎯 Pfeil "+TURN.length+": "+fname(c,v));cm("Pfeil "+TURN.length+" erkannt: "+fname(c,v)+". Stimmt das? Tippe unten auf ✓ oder ✗.")}
function tick(){if(!cv.srcObject||!cv.videoWidth){if(MST!="off")setSt("off");PREV=null;return}if(ca)return;
 const fr=frame();if(!fr)return;const now=Date.now(),m=motion(fr),calm=m<=4;
 // Rauschminderung: bei ruhigem Bild mit dem vorigen ruhigen Bild mitteln (Rauschen und Nachschärfen der Kamera halbieren sich)
 let f=fr;if(AVGON&&calm&&PCALM&&PF&&PF.width==fr.width&&PF.height==fr.height&&PF.z==fr.z){const a=fr.data,b=PF.data,o=new Uint8ClampedArray(a.length);for(let i=0;i<a.length;i++)o[i]=(a[i]+b[i]+1)>>1;f={width:fr.width,height:fr.height,data:o,z:fr.z}}
 PF=fr;PCALM=calm;
 if(m>4){if(!MOVE0)MOVE0=now;STILL=now;if(now-MOVE0<8000){if(MST!="move")setSt("move");PDART=null;return}NOISY=true}else{MOVE0=0;NOISY=false}

 if(NOISY)$("#cst2").textContent="● Scheibe erkannt (Bild etwas unruhig)";
 if(!ref||WANT=="ref"){setRefs(f,WANT=="ref");WANT=null;return}
 const force=WANT=="det";WANT=null;dartCheck(f,force)}
function loop(){const t0=performance.now();try{tick()}catch(e){}const dt=performance.now()-t0;
 if(MST=="ok"&&ref&&dt>5&&ADAPT<3){PERF.push(dt);if(PERF.length>=4){const av=PERF.reduce((a,b)=>a+b,0)/PERF.length;PERF=[];let n=AW;
  if(av>350)n=AW>800?800:640;else if(av<110&&AW<1280&&cv.videoWidth>=1600)n=1280;
  if(n!=AW){AW=n;ADAPT++;BASE=null;PREV=null;MASK=null}else ADAPT=3}}

 o.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const id=b.dataset.p;if(id==ST.cur)return;if(s&&!s.done&&s.darts>0&&!confirm("Das laufende Training wird verworfen. Profil wechseln?"))return;s=null;H=[];useP(id);stt();pfBar();go(view)});
