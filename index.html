<style>
:root{--bg:#f4f5f7;--cd:#fff;--tx:#1b1f27;--mu:#667085;--ac:#1f6feb;--ok:#1a7f4b;--bd:#d9dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--cd:#1c212b;--tx:#eef0f4;--mu:#9aa3b2;--ac:#5aa2ff;--ok:#4cc38a;--bd:#2d3441;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--cd:#1c212b;--tx:#eef0f4;--mu:#9aa3b2;--ac:#5aa2ff;--ok:#4cc38a;--bd:#2d3441;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 Arial,Helvetica,sans-serif}
nav{display:flex;gap:8px;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1}
button{min-height:48px;padding:0 14px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);font:inherit;font-weight:700}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 10px 24px;max-width:1100px;margin:auto}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card.today{border:2px solid var(--ac)}
h2{margin:0 0 4px;font-size:18px}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:minmax(300px,1.2fr) 1fr;gap:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.big{font-size:26px;font-weight:700}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.st b{display:block;font-size:22px}
svg.b{width:100%;max-height:78vh;touch-action:manipulation}
svg.b path,svg.b circle{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.vl{--gold:#f2c46d;--dk:#2f3033;--dk2:#46474b;--lc:#e7e8ea;--lt:#2a2b2e;font-family:"Roboto Condensed","sans-serif-condensed","Arial Narrow",Arial,sans-serif}

.vl button{font-family:inherit}

.vl .vtab{font-size:16px}.vl .vtab th{font-size:14px;text-transform:uppercase;opacity:.7;font-weight:700;white-space:nowrap}

.vl .vtab input{min-width:120px;min-height:36px;font:inherit;border:1px solid rgba(127,127,127,.35);border-radius:8px;padding:0 8px;background:transparent;color:inherit}
.vl .vg{color:#1f9a5f}.vl .vb{color:#d64545}

.wp .wpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

.wp .wpok{margin-left:auto;color:#1f9a5f;font-weight:700;font-size:15px}

// Die Kameras sitzen fest am Winmau-Plasma-Ring (Autodarts-Halter), schauen schräg (ca. 35–55°) auf die Scheibe und haben 100°-Linsen.
// Aus so schräger Sicht findet die normale Suche die Scheibe nicht. Deshalb: mögliche Kameralagen um die angegebene Zahl
// durchrechnen, jede kurz bewerten, die besten fein einpassen. Die Angabe der Zahl macht die Nummerierung eindeutig
// (die Scheibe sieht nach 36° Drehung gleich aus).
const RG={foc:.49,ths:5,thw:40,zs:[150,210,270,330],rs:[320,370],rolls:[0,90,180,270],top:6};

 const form=PFM?`<div class="pff"><div class="pfh">${PFM=="add"?"Neues Profil":"Name ändern"}</div><input id="pfin" maxlength="20" autocomplete="off" placeholder="Name" value="${PFM=="ren"?esc(P0.name):""}"><div class="pfe">${esc(PFE)}</div><div class="pfbt"><button id="pfno">Abbrechen</button><button id="pfok" class="pri">${PFM=="add"?"Anlegen":"Speichern"}</button></div></div>`
  :`<button class="pfi" id="pfadd"><span class="pfa e">＋</span>Profil hinzufügen</button><button class="pfi" id="pren"><span class="pfa e">✎</span>Name von „${esc(P0.name)}“ ändern</button>`;
 o.innerHTML=`<div class="pfw"><button id="pfb" class="pfb" aria-haspopup="true"><span class="pfa">${ini(P0.name)}</span><span class="pfn">${esc(P0.name)}</span><span class="pfc">▾</span></button>
 <div class="pfm" id="pfm"${PFO?"":" hidden"}><div class="pfh">Profil wählen</div>${Object.keys(ST.p).map(id=>`<button class="pfi${id==ST.cur?" on":""}" data-p="${id}"><span class="pfa">${ini(ST.p[id].name)}</span><span class="pft">${esc(ST.p[id].name)}<small>${cnt(id)} ${cnt(id)==1?"Einheit":"Einheiten"}${id=="p1"?" · beim Start":""}</small></span>${id==ST.cur?'<span class="pfk">✓</span>':""}</button>`).join("")}
 <div class="pfs"></div>${form}</div></div>`+'<button id="nset" class="'+(view==3?'on':'')+'" style="margin-left:auto">⚙ Einrichtung</button>';
 $("#nset").onclick=()=>go(3);
 $("#pfb").onclick=e=>{e.stopPropagation();PFO=!PFO;PFM="";PFE="";pfBar()};
 o.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const id=b.dataset.p;if(!pfSwitch(id))return;PFO=false;PFM="";pfBar();go(view)});
 const q=x=>o.querySelector(x);
 if(q("#pfadd"))q("#pfadd").onclick=()=>{PFM="add";PFE="";pfBar()};

  else ST.p[ST.cur].name=n;
  save();PFO=false;PFM="";PFE="";pfBar();go(view)}}
document.addEventListener("click",e=>{if(PFO&&!e.target.closest(".pfw")){PFO=false;PFM="";PFE="";pfBar()}});
stt();renderTurn();AZ=DB.cam.az!==false;setView(DB.cam.z||1,DB.cam.zc||[.5,.5],true);pfBar();try{ringInit()}catch(e){}try{duoInit()}catch(e){}
